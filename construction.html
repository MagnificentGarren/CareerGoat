<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="CareerGoat is under construction. We're getting your next career move ready.">
    <title>Under Construction | CareerGoat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --night: #07111f;
            --yellow: #ffd447;
            --cyan: #62e5f4;
            --white: #f5f7fb;
            --muted: #b7c3d1;
        }

        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 28px;
            place-items: center;
            color: var(--white);
            background:
                linear-gradient(90deg, rgba(7,17,31,.89), rgba(7,17,31,.54) 52%, rgba(7,17,31,.23)),
                linear-gradient(0deg, rgba(7,17,31,.54), transparent 70%),
                url("careergoat-background.png") center / cover no-repeat,
                var(--night);
            font-family: "DM Sans", sans-serif;
        }

        main {
            width: min(660px, 100%);
            padding: clamp(30px, 7vw, 66px);
            background: rgba(7,17,31,.68);
            border: 1px solid rgba(245,247,251,.17);
            border-radius: 12px;
            box-shadow: 0 24px 80px rgba(0,0,0,.32);
            backdrop-filter: blur(12px);
        }

        .brand { color: var(--white); font: 700 14px "Space Grotesk", sans-serif; letter-spacing: .08em; }
        .brand span { color: var(--yellow); }
        .eyebrow { margin: 56px 0 16px; color: var(--cyan); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
        h1 { margin: 0 0 18px; font: 700 clamp(42px, 9vw, 76px)/.95 "Space Grotesk", sans-serif; letter-spacing: -.075em; }
        h1 em { color: var(--yellow); font-style: normal; }
        p { max-width: 470px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
        a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            margin-top: 30px;
            padding: 0 18px;
            color: var(--night);
            background: var(--yellow);
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .07em;
            text-decoration: none;
            text-transform: uppercase;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(255,212,71,.28); }
        a:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }

        @media (max-width: 600px) {
            body { padding: 18px; background-position: 55% center; }
            .eyebrow { margin-top: 42px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">CAREER<span>GOAT</span></div>
        <div class="eyebrow">Good things are in progress</div>
        <h1>Page under<br><em>construction.</em></h1>
        <p>We’re building a sharper way to tailor your CV, close the skills gap, and get ready for your next interview. Check back soon.</p>
        <a href="summit-blue.html">Back to home <span aria-hidden="true">↗</span></a>
    </main>
</body>
</html>
